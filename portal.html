<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse IT Consulting — Client Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --surface-container-lowest:#060e20; --surface:#0b1326; --surface-container-low:#131b2e;
  --surface-container:#171f33; --surface-container-high:#222a3d; --surface-container-highest:#2d3449;
  --surface-bright:#31394d; --surface-variant:#2d3449;
  --on-surface:#dae2fd; --on-surface-variant:#c7c4d7; --outline:#908fa0; --outline-variant:#464554;
  --primary:#c0c1ff; --secondary:#4cd7f6; --tertiary:#fbabff;
  --neon-magenta:#ec0fff; --neon-magenta-bright:#ff3dff;
  --success:#06d6f0; --warning:#ffc24b; --critical:#d946ef;
  --gradient-neon:linear-gradient(135deg,#ec0fff 0%,#8083ff 100%);
  --radius:0.25rem; --radius-md:0.375rem; --radius-lg:0.5rem; --radius-xl:0.75rem; --radius-full:9999px;
  --glass-fill:rgba(23,31,51,0.55); --glass-border:rgba(255,255,255,0.10);
  --glass-blur:12px; --glass-blur-floating:24px;
  --glow-cyan:0 0 16px rgba(76,215,246,0.45);
  --glow-magenta-sh:0 0 24px rgba(236,15,255,0.45);
  --shadow-float:0 16px 50px rgba(0,0,0,0.55);
  --ease-out:cubic-bezier(0.16,1,0.3,1); --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --dur:220ms; --dur-slow:400ms;
  --font-display:'Geist',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-container-lowest);color:var(--on-surface);font-family:var(--font-body)}

.pp-shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* Shared atoms */
.pit-status{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
  color:var(--on-surface-variant);display:inline-flex;align-items:center;gap:7px}
.pit-status--mag{color:var(--tertiary)}
.pit-pip{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);
  animation:pp-pulse 1.8s var(--ease-in-out) infinite}
@keyframes pp-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pp-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-surface-variant)}

.pp-btn{font-family:var(--font-body);font-size:13px;font-weight:600;border-radius:var(--radius);cursor:pointer;
  padding:9px 16px;border:1px solid var(--glass-border);background:var(--surface-container-high);color:var(--on-surface);
  display:inline-flex;align-items:center;gap:7px;transition:all var(--dur) var(--ease-out)}
.pp-btn:hover{background:var(--surface-bright)}
.pp-btn--mono{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.pp-btn--neon{background:var(--neon-magenta);color:#fff;border-color:transparent;box-shadow:var(--glow-magenta-sh)}
.pp-btn--neon:hover{background:var(--neon-magenta-bright)}

/* Sidebar */
.pp-sidebar{background:var(--surface);border-right:1px solid var(--outline-variant);padding:22px 16px;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.pp-logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.pp-wm{font-family:var(--font-mono);font-weight:700;font-size:17px;letter-spacing:.04em}
.pp-wm span{color:var(--neon-magenta)}
.pp-navlabel{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--outline);padding:0 8px 10px}
.pp-nav{display:flex;flex-direction:column;gap:4px}
.pp-navitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-md);cursor:pointer;
  font-size:14px;color:var(--on-surface-variant);text-decoration:none;transition:all var(--dur)}
.pp-navitem:hover{background:var(--surface-container);color:var(--on-surface)}
.pp-navitem.is-active{background:rgba(236,15,255,.12);color:var(--tertiary);box-shadow:inset 0 0 0 1px rgba(236,15,255,.3)}
.pp-navbadge{margin-left:auto;font-family:var(--font-mono);font-size:11px;background:var(--neon-magenta);color:#fff;
  border-radius:var(--radius-full);min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.pp-sidefoot{margin-top:auto;padding-top:16px}
.pp-plan{border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:14px;background:var(--surface-container-low)}
.pp-plan p{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--on-surface-variant)}

/* Main */
.pp-main{display:flex;flex-direction:column;min-width:0}
.pp-topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:20px 32px;background:rgba(11,19,38,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--outline-variant)}
.pp-title{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0}
.pp-topbar__right{display:flex;align-items:center;gap:14px}
.pp-search{display:flex;align-items:center;gap:9px;background:var(--surface-container-lowest);border:1px solid var(--outline-variant);
  border-radius:var(--radius);padding:9px 13px;color:var(--on-surface-variant);transition:all var(--dur)}
.pp-search:focus-within{border-color:var(--secondary);box-shadow:var(--glow-cyan)}
.pp-search input{background:none;border:none;outline:none;color:var(--on-surface);font-family:var(--font-body);font-size:14px;width:200px}
.pp-search input::placeholder{color:var(--outline)}
.pp-iconbtn{position:relative;background:var(--surface-container);border:1px solid var(--glass-border);border-radius:var(--radius);
  width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--on-surface-variant);cursor:pointer}
.pp-iconbtn:hover{color:var(--on-surface)}
.pp-dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--neon-magenta);box-shadow:0 0 6px var(--neon-magenta)}
.pp-avatar{width:38px;height:38px;border-radius:var(--radius);background:var(--gradient-neon);color:#fff;
  font-family:var(--font-mono);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}

.pp-content{padding:28px 32px 60px;display:flex;flex-direction:column;gap:22px}

/* Stat cards */
.pp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pp-stat{background:var(--glass-fill);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:18px 20px}
.pp-stat__top{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.pp-stat__icon{width:30px;height:30px;border-radius:var(--radius);background:rgba(76,215,246,.12);color:var(--secondary);
  display:flex;align-items:center;justify-content:center}
.pp-stat__label{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;color:var(--on-surface-variant)}
.pp-stat__value{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em}
.pp-stat__delta{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;
  color:var(--on-surface-variant);margin-top:6px}
.pp-stat__delta.is-good{color:var(--success)}

/* Panels */
.pp-grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
.pp-panel{background:var(--glass-fill);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:20px 22px}
.pp-panel__head{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:16px;
  border-bottom:1px solid var(--outline-variant)}
.pp-panel__head h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}

/* Chart */
.pp-chiprow{display:flex;gap:6px}
.pp-chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;padding:4px 9px;border-radius:var(--radius);
  border:1px solid var(--outline-variant);color:var(--on-surface-variant);cursor:pointer}
.pp-chip.is-active{color:var(--secondary);border-color:rgba(76,215,246,.4);background:rgba(76,215,246,.08)}
.pp-chart{margin:4px 0}
.pp-chart__foot{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--outline-variant);margin-top:8px}

/* System status */
.pp-statlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pp-statrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--outline-variant)}
.pp-statrow:last-child{border-bottom:none}
.pp-srvpip{width:9px;height:9px;border-radius:50%;flex:none}
.pp-srvpip--operational{background:var(--success);box-shadow:0 0 8px var(--success);animation:pp-pulse 2s var(--ease-in-out) infinite}
.pp-srvpip--degraded{background:var(--warning);box-shadow:0 0 8px var(--warning)}
.pp-srvpip--critical{background:var(--critical);box-shadow:0 0 8px var(--critical)}
.pp-srvname{font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-srvmeta{font-family:var(--font-mono);font-size:11px;color:var(--on-surface-variant)}
.pp-srvstate{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;min-width:92px;text-align:right}
.pp-srvstate--operational{color:var(--success)}
.pp-srvstate--degraded{color:var(--warning)}
.pp-srvstate--critical{color:var(--critical)}

/* Tickets */
.pp-table{display:flex;flex-direction:column}
.pp-thead,.pp-trow{display:grid;grid-template-columns:96px 1fr 84px 116px 110px 50px;gap:14px;align-items:center}
.pp-thead{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;color:var(--outline);padding:0 8px 12px;border-bottom:1px solid var(--outline-variant)}
.pp-trow{padding:13px 8px;border-bottom:1px solid var(--outline-variant);cursor:pointer;border-radius:var(--radius);transition:background var(--dur)}
.pp-trow:hover{background:var(--surface-container)}
.pp-tid{font-family:var(--font-mono);font-size:12.5px;color:var(--secondary)}
.pp-tsubject{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-towner{font-size:13px;color:var(--on-surface-variant)}
.pp-tage{font-family:var(--font-mono);font-size:12px;color:var(--on-surface-variant)}
.pp-pri,.pp-tstatus{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;padding:4px 8px;border-radius:var(--radius);font-style:normal;display:inline-block}
.pp-pri--high{color:var(--tertiary);background:rgba(217,70,239,.14)}
.pp-pri--med{color:var(--warning);background:rgba(255,194,75,.12)}
.pp-pri--low{color:var(--on-surface-variant);background:var(--surface-container-high)}
.pp-tstatus--open{color:var(--secondary);background:rgba(76,215,246,.12)}
.pp-tstatus--progress{color:var(--primary);background:rgba(128,131,255,.14)}
.pp-tstatus--resolved{color:var(--success);background:rgba(6,214,240,.1)}

/* Drawer */
.pp-overlay{position:fixed;inset:0;z-index:100;background:rgba(6,14,32,.55);backdrop-filter:blur(3px);
  display:flex;justify-content:flex-end;animation:pp-fade var(--dur) var(--ease-out)}
.pp-drawer{width:440px;max-width:92vw;height:100%;background:rgba(19,27,46,.9);
  backdrop-filter:blur(var(--glass-blur-floating));-webkit-backdrop-filter:blur(var(--glass-blur-floating));
  border-left:1px solid var(--glass-border);box-shadow:var(--shadow-float);padding:24px;display:flex;flex-direction:column;
  animation:pp-slide var(--dur-slow) var(--ease-out)}
.pp-drawer__head{display:flex;align-items:center;justify-content:space-between}
.pp-drawer__title{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin:14px 0 12px;line-height:1.2}
.pp-drawer__meta{display:flex;align-items:center;gap:14px}
.pp-drawer__rule{height:1px;background:var(--outline-variant);margin:20px 0}
.pp-thread{display:flex;flex-direction:column;gap:16px;flex:1;overflow:auto}
.pp-msg{background:var(--surface-container);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:14px}
.pp-msg--eng{background:rgba(128,131,255,.08);border-color:rgba(128,131,255,.25)}
.pp-msg__who{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--on-surface-variant);margin-bottom:7px}
.pp-msg p{margin:0;font-size:14px;line-height:1.55}
.pp-replybar{display:flex;gap:10px;margin-top:16px}
.pp-replybar input{flex:1;background:var(--surface-container-lowest);border:1px solid var(--outline-variant);border-radius:var(--radius);
  padding:11px 13px;color:var(--on-surface);font-family:var(--font-body);font-size:14px;outline:none}
.pp-replybar input:focus{border-color:var(--secondary);box-shadow:var(--glow-cyan)}
@keyframes pp-fade{from{opacity:0}to{opacity:1}}
@keyframes pp-slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}

@media(max-width:1080px){.pp-stats{grid-template-columns:repeat(2,1fr)}.pp-grid2{grid-template-columns:1fr}}
@media(max-width:760px){
  .pp-shell{grid-template-columns:1fr} .pp-sidebar{display:none} .pp-search input{width:120px}
  .pp-thead,.pp-trow{grid-template-columns:80px 1fr 70px}
  .pp-towner,.pp-tage,.pp-thead span:nth-child(4),.pp-trow span:nth-child(4){display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel">

function Icon({ name, size=20, color, strokeWidth=2, style={} }) {
  return <i data-lucide={name} style={{width:size,height:size,display:'inline-flex',color,...style}} data-stroke={strokeWidth} />;
}
function useLucide() {
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
}

const NAV_ITEMS = [
  {id:'overview', icon:'layout-dashboard', label:'Overview'},
  {id:'tickets',  icon:'ticket',           label:'Tickets', badge:4},
  {id:'monitoring',icon:'activity',        label:'Monitoring'},
  {id:'assets',   icon:'server',           label:'Assets'},
  {id:'billing',  icon:'credit-card',      label:'Billing'},
];
function Sidebar({ active, onNav }) {
  return (
    <aside className="pp-sidebar">
      <div className="pp-logo">
        <img src="assets/logo-mark.svg" alt="" width="30" height="30" onError={e=>e.target.style.display='none'}/>
        <span className="pp-wm">PULSE<span>_IT</span></span>
      </div>
      <div className="pp-navlabel">CONSOLE</div>
      <nav className="pp-nav">
        {NAV_ITEMS.map(n=>(
          <a key={n.id} className={'pp-navitem'+(active===n.id?' is-active':'')} onClick={()=>onNav(n.id)}>
            <Icon name={n.icon} size={18}/><span>{n.label}</span>
            {n.badge && <span className="pp-navbadge">{n.badge}</span>}
          </a>
        ))}
      </nav>
      <div className="pp-sidefoot">
        <div className="pp-plan">
          <span className="pit-status"><span className="pit-pip"/>ALL NODES OPERATIONAL</span>
          <p>Managed Plan · Tier III</p>
        </div>
      </div>
    </aside>
  );
}

function Topbar({ title }) {
  return (
    <header className="pp-topbar">
      <div>
        <div className="pp-eyebrow">PULSE_IT · CLIENT_CONSOLE</div>
        <h1 className="pp-title">{title}</h1>
      </div>
      <div className="pp-topbar__right">
        <label className="pp-search">
          <Icon name="search" size={16}/>
          <input placeholder="Search tickets, assets…"/>
        </label>
        <button className="pp-iconbtn"><Icon name="bell" size={18}/><span className="pp-dot"/></button>
        <div className="pp-avatar">AC</div>
      </div>
    </header>
  );
}

const STATS = [
  {label:'OPEN_TICKETS', value:'4',       delta:'−2 this week', trend:'down', good:true, icon:'ticket'},
  {label:'UPTIME_30D',   value:'99.999%', delta:'SLA met',      trend:'flat', good:true, icon:'circle-check-big'},
  {label:'AVG_RESPONSE', value:'0.8ms',   delta:'−0.2ms',       trend:'down', good:true, icon:'zap'},
  {label:'ACTIVE_NODES', value:'128',     delta:'+6 online',    trend:'up',   good:true, icon:'server'},
];
function StatCards() {
  return (
    <div className="pp-stats">
      {STATS.map(s=>(
        <div key={s.label} className="pp-stat">
          <div className="pp-stat__top">
            <span className="pp-stat__icon"><Icon name={s.icon} size={16}/></span>
            <span className="pp-stat__label">{s.label}</span>
          </div>
          <div className="pp-stat__value">{s.value}</div>
          <div className={'pp-stat__delta'+(s.good?' is-good':'')}>
            <Icon name={s.trend==='up'?'trending-up':s.trend==='down'?'trending-down':'minus'} size={14}/>
            {s.delta}
          </div>
        </div>
      ))}
    </div>
  );
}

function UptimeChart() {
  const pts=[38,30,44,28,34,22,30,18,26,16,24,14];
  const W=520,H=150,pad=8,max=48;
  const step=(W-pad*2)/(pts.length-1);
  const coords=pts.map((v,i)=>[pad+i*step, H-pad-(v/max)*(H-pad*2)]);
  const line=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=`${line} L ${W-pad} ${H} L ${pad} ${H} Z`;
  return (
    <section className="pp-panel">
      <div className="pp-panel__head">
        <h3>Network Latency</h3>
        <div className="pp-chiprow">
          <span className="pp-chip is-active">24H</span>
          <span className="pp-chip">7D</span>
          <span className="pp-chip">30D</span>
        </div>
      </div>
      <div className="pp-chart">
        <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" width="100%" height="150">
          <defs>
            <linearGradient id="ppArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#4cd7f6" stopOpacity="0.45"/>
              <stop offset="100%" stopColor="#4cd7f6" stopOpacity="0"/>
            </linearGradient>
            <linearGradient id="ppLine" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stopColor="#8083ff"/>
              <stop offset="100%" stopColor="#4cd7f6"/>
            </linearGradient>
          </defs>
          <path d={area} fill="url(#ppArea)"/>
          <path d={line} fill="none" stroke="url(#ppLine)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          {coords.map((c,i)=><circle key={i} cx={c[0]} cy={c[1]} r="2.5" fill="#4cd7f6"/>)}
        </svg>
      </div>
      <div className="pp-chart__foot">
        <span className="pit-status pit-status--mag">PEAK 0.42ms</span>
        <span className="pit-status"><span className="pit-pip"/>AVG 0.8ms · TRENDING DOWN</span>
      </div>
    </section>
  );
}

const SVC_STATUS = [
  {name:'Cloud Cluster · us-east', state:'operational', meta:'128 nodes'},
  {name:'Edge Network',            state:'operational', meta:'sub-1ms'},
  {name:'Threat Detection',        state:'operational', meta:'real-time'},
  {name:'Backup Pipeline',         state:'degraded',    meta:'retrying'},
  {name:'Quantum Encryption',      state:'operational', meta:'v2.4'},
];
const STATE_LABEL = {operational:'OPERATIONAL', degraded:'DEGRADED', critical:'CRITICAL'};
function SystemStatus() {
  return (
    <section className="pp-panel">
      <div className="pp-panel__head">
        <h3>System Status</h3>
        <span className="pit-status"><span className="pit-pip"/>LIVE</span>
      </div>
      <ul className="pp-statlist">
        {SVC_STATUS.map(s=>(
          <li key={s.name} className="pp-statrow">
            <span className={'pp-srvpip pp-srvpip--'+s.state}/>
            <span className="pp-srvname">{s.name}</span>
            <span className="pp-srvmeta">{s.meta}</span>
            <span className={'pp-srvstate pp-srvstate--'+s.state}>{STATE_LABEL[s.state]}</span>
          </li>
        ))}
      </ul>
    </section>
  );
}

const TICKETS = [
  {id:'PIT-4821',subject:'Migrate legacy mail to managed cloud',    pri:'high',status:'open',    owner:'R. Okafor',age:'2h'},
  {id:'PIT-4818',subject:'WordPress → new design system rebuild',   pri:'med', status:'progress',owner:'L. Tran',   age:'1d'},
  {id:'PIT-4810',subject:'Add MFA to admin console',                pri:'high',status:'progress',owner:'R. Okafor',age:'1d'},
  {id:'PIT-4799',subject:'Quarterly security audit report',         pri:'low', status:'open',    owner:'Unassigned',age:'3d'},
  {id:'PIT-4790',subject:'DNS cutover for marketing site',          pri:'med', status:'resolved',owner:'L. Tran',   age:'5d'},
];
const PRI_LABEL   = {high:'HIGH',med:'MED',low:'LOW'};
const STAT_LABEL  = {open:'OPEN',progress:'IN_PROGRESS',resolved:'RESOLVED'};
function TicketsTable({ onOpen }) {
  return (
    <section className="pp-panel">
      <div className="pp-panel__head">
        <h3>Support Tickets</h3>
        <button className="pp-btn pp-btn--mono"><Icon name="plus" size={14}/>NEW_TICKET</button>
      </div>
      <div className="pp-table">
        <div className="pp-thead"><span>ID</span><span>SUBJECT</span><span>PRIORITY</span><span>STATUS</span><span>OWNER</span><span>AGE</span></div>
        {TICKETS.map(t=>(
          <div key={t.id} className="pp-trow" onClick={()=>onOpen(t)}>
            <span className="pp-tid">{t.id}</span>
            <span className="pp-tsubject">{t.subject}</span>
            <span><em className={'pp-pri pp-pri--'+t.pri}>{PRI_LABEL[t.pri]}</em></span>
            <span><em className={'pp-tstatus pp-tstatus--'+t.status}>{STAT_LABEL[t.status]}</em></span>
            <span className="pp-towner">{t.owner}</span>
            <span className="pp-tage">{t.age}</span>
          </div>
        ))}
      </div>
    </section>
  );
}

function TicketDrawer({ ticket, onClose }) {
  if (!ticket) return null;
  return (
    <div className="pp-overlay" onClick={onClose}>
      <aside className="pp-drawer" onClick={e=>e.stopPropagation()}>
        <div className="pp-drawer__head">
          <span className="pp-tid">{ticket.id}</span>
          <button className="pp-iconbtn" onClick={onClose}><Icon name="x" size={18}/></button>
        </div>
        <h2 className="pp-drawer__title">{ticket.subject}</h2>
        <div className="pp-drawer__meta">
          <em className={'pp-pri pp-pri--'+ticket.pri}>{(ticket.pri||'').toUpperCase()}</em>
          <span className="pit-status"><span className="pit-pip"/>OWNER · {ticket.owner}</span>
        </div>
        <div className="pp-drawer__rule"/>
        <div className="pp-thread">
          <div className="pp-msg">
            <div className="pp-msg__who">CLIENT · 2h ago</div>
            <p>Our legacy mail server is hitting capacity. We'd like to migrate to the managed cloud tier with zero downtime if possible.</p>
          </div>
          <div className="pp-msg pp-msg--eng">
            <div className="pp-msg__who">PULSE_ENGINEER · 1h ago</div>
            <p>Acknowledged. We'll stage a parallel cluster and cut over DNS during your low-traffic window. ETA 48h.</p>
          </div>
        </div>
        <div className="pp-replybar">
          <input placeholder="Reply to thread…"/>
          <button className="pp-btn pp-btn--neon pp-btn--mono">SEND</button>
        </div>
      </aside>
    </div>
  );
}

function App() {
  const [active, setActive] = React.useState('overview');
  const [ticket, setTicket] = React.useState(null);
  useLucide();
  const titles = {overview:'Overview',tickets:'Support Tickets',monitoring:'Monitoring',assets:'Assets',billing:'Billing'};
  return (
    <div className="pp-shell">
      <Sidebar active={active} onNav={setActive}/>
      <div className="pp-main">
        <Topbar title={titles[active]}/>
        <div className="pp-content">
          <StatCards/>
          <div className="pp-grid2"><UptimeChart/><SystemStatus/></div>
          <TicketsTable onOpen={setTicket}/>
        </div>
      </div>
      <TicketDrawer ticket={ticket} onClose={()=>setTicket(null)}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
