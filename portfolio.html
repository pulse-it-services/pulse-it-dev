<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio — Pulse IT Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --surface-container-lowest:#060e20; --surface:#0b1326; --surface-container-low:#131b2e;
  --surface-container:#171f33; --surface-container-high:#222a3d; --surface-container-highest:#2d3449;
  --surface-bright:#31394d;
  --on-surface:#dae2fd; --on-surface-variant:#c7c4d7; --outline:#908fa0; --outline-variant:#464554;
  --primary:#c0c1ff; --secondary:#4cd7f6; --tertiary:#fbabff;
  --neon-magenta:#ec0fff; --neon-magenta-bright:#ff3dff;
  --success:#06d6f0;
  --gradient-heading:linear-gradient(180deg,#fbabff 0%,#ec0fff 100%);
  --radius:0.25rem; --radius-md:0.375rem; --radius-lg:0.5rem; --radius-xl:0.75rem; --radius-full:9999px;
  --margin-mobile:16px; --margin-desktop:48px; --container-max:1280px; --section-gap:96px;
  --glass-fill:rgba(23,31,51,0.55); --glass-border:rgba(255,255,255,0.10);
  --glass-blur:12px; --glass-blur-floating:24px;
  --glow-cyan:0 0 16px rgba(76,215,246,0.45); --glow-magenta-sh:0 0 24px rgba(236,15,255,0.45);
  --shadow-card:0 8px 30px rgba(0,0,0,0.45); --shadow-float:0 16px 50px rgba(0,0,0,0.55);
  --ease-out:cubic-bezier(0.16,1,0.3,1); --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --dur:220ms; --dur-slow:400ms;
  --font-display:'Geist',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
.text-gradient{background:var(--gradient-heading);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--surface-container-lowest);color:var(--on-surface);font-family:var(--font-body)}
.pit-site{position:relative;overflow-x:hidden}
.pit-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 18% 0%,rgba(128,131,255,.22) 0%,transparent 60%),
             radial-gradient(45% 40% at 88% 8%,rgba(236,15,255,.16) 0%,transparent 55%),
             var(--surface-container-lowest)}
main,.pit-nav,.pit-footer{position:relative;z-index:1}

.pit-btn{font-family:var(--font-body);font-size:15px;font-weight:600;border-radius:var(--radius);
  cursor:pointer;padding:13px 24px;border:1px solid transparent;transition:all var(--dur) var(--ease-out);
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pit-btn--neon{background:var(--neon-magenta);color:#fff;box-shadow:var(--glow-magenta-sh)}
.pit-btn--neon:hover{background:var(--neon-magenta-bright);box-shadow:0 0 32px rgba(236,15,255,.6)}
.pit-btn--quiet{background:var(--surface-container-high);color:var(--on-surface);border-color:var(--glass-border)}
.pit-btn--quiet:hover{background:var(--surface-bright);border-color:var(--secondary)}
.pit-btn--mono{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;font-size:13px;font-weight:500}
.pit-btn:active{transform:translateY(1px)}

.pit-eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tertiary);border:1px dashed rgba(236,15,255,.4);border-radius:var(--radius);padding:6px 12px;display:inline-block}
.pit-logo{display:inline-flex;align-items:center;gap:11px;text-decoration:none}
.pit-wm{font-family:var(--font-mono);font-weight:700;font-size:19px;letter-spacing:.04em;color:var(--on-surface)}
.pit-wm span{color:var(--neon-magenta)}
.pit-status{font-family:var(--font-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--on-surface-variant);display:inline-flex;align-items:center;gap:8px}
.pit-pip{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);
  animation:pit-pulse-dot 1.8s var(--ease-in-out) infinite}
@keyframes pit-pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

/* Nav */
.pit-nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  max-width:var(--container-max);margin:0 auto;padding:18px var(--margin-desktop);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pit-navlinks{display:flex;gap:34px}
.pit-navlink{font-family:var(--font-body);font-size:15px;color:var(--on-surface-variant);
  text-decoration:none;transition:color var(--dur)}
.pit-navlink:hover{color:var(--on-surface)}
.pit-navlink.is-active{color:var(--tertiary);text-shadow:0 0 12px rgba(236,15,255,.5)}
.pit-burger{display:none;background:none;border:none;color:var(--on-surface);cursor:pointer;padding:4px}
.pit-mobilemenu{display:none}

/* Page hero */
.page-hero{max-width:var(--container-max);margin:0 auto;
  padding:88px var(--margin-desktop) 72px;border-bottom:1px solid var(--outline-variant)}
.page-hero h1{font-family:var(--font-display);font-size:clamp(40px,5.5vw,64px);font-weight:800;
  line-height:1.04;letter-spacing:-.04em;margin:20px 0 24px;max-width:18ch}
.page-hero p{font-family:var(--font-body);font-size:18px;line-height:1.65;
  color:var(--on-surface-variant);max-width:54ch;margin:0}
.page-hero__meta{display:flex;align-items:center;gap:24px;margin-top:28px;flex-wrap:wrap}
.hero-stat{display:flex;flex-direction:column;gap:2px}
.hero-stat__num{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.04em}
.hero-stat__label{font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--on-surface-variant)}
.hero-divider{width:1px;height:36px;background:var(--outline-variant)}

/* Portfolio grid */
.pit-section{max-width:var(--container-max);margin:0 auto;padding:var(--section-gap) var(--margin-desktop)}
.port-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}

/* Project card */
.port-card{background:var(--glass-fill);backdrop-filter:blur(var(--glass-blur));
  -webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);
  border-radius:var(--radius-xl);overflow:hidden;display:flex;flex-direction:column;
  transition:all var(--dur) var(--ease-out);cursor:default}
.port-card:hover{border-color:var(--pc-accent,rgba(236,15,255,.4));
  box-shadow:0 0 40px var(--pc-glow,rgba(236,15,255,.12));transform:translateY(-4px)}
.port-card__thumb{position:relative;height:240px;overflow:hidden;flex:none}
.port-card__img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 600ms var(--ease-out)}
.port-card:hover .port-card__img{transform:scale(1.04)}
.port-card__overlay{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(6,14,32,.08) 0%,rgba(6,14,32,.72) 100%)}
.port-card__tint{position:absolute;inset:0;opacity:.35;mix-blend-mode:color}
.port-card__badges{position:absolute;top:16px;left:16px;display:flex;gap:8px}
.port-badge{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.18);
  background:rgba(6,14,32,.55);backdrop-filter:blur(8px);color:var(--on-surface)}
.port-badge--live{border-color:rgba(6,214,240,.5);color:var(--success);
  background:rgba(6,214,240,.1);display:flex;align-items:center;gap:6px}
.port-badge--live::before{content:'';width:6px;height:6px;border-radius:50%;
  background:var(--success);box-shadow:0 0 6px var(--success)}
.port-card__num{position:absolute;bottom:16px;right:20px;font-family:var(--font-display);
  font-size:52px;font-weight:900;letter-spacing:-.06em;line-height:1;
  color:rgba(255,255,255,.07);pointer-events:none;user-select:none}

/* Card body */
.port-card__body{padding:28px 32px 32px;display:flex;flex-direction:column;gap:14px;flex:1}
.port-card__cat{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--on-surface-variant)}
.port-card__title{font-family:var(--font-display);font-size:24px;font-weight:800;
  margin:0;letter-spacing:-.02em}
.port-card__loc{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;
  color:var(--on-surface-variant);margin-top:-8px}
.port-card__desc{font-family:var(--font-body);font-size:15px;line-height:1.65;
  color:var(--on-surface-variant);margin:0;flex:1}
.port-stack{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.port-stack-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;
  padding:4px 10px;border-radius:var(--radius);
  background:rgba(255,255,255,.05);border:1px solid var(--outline-variant);
  color:var(--on-surface-variant)}
.port-card__foot{display:flex;align-items:center;justify-content:space-between;
  padding-top:18px;border-top:1px solid var(--outline-variant);margin-top:auto}
.port-link{font-family:var(--font-mono);font-size:12px;letter-spacing:.07em;
  text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;
  text-decoration:none;transition:gap var(--dur) var(--ease-out);color:var(--pc-accent-color,var(--secondary))}
.port-link:hover{gap:11px}
.port-link--disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.port-card__scope{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--on-surface-variant);
  display:flex;align-items:center;gap:6px}

/* CTA */
.pit-cta{position:relative;overflow:hidden;text-align:center;border-radius:var(--radius-xl);
  border:1px solid var(--glass-border);padding:72px 32px;
  background:linear-gradient(180deg,rgba(34,42,61,.6),rgba(11,19,38,.6));
  backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}
.pit-cta__glow{position:absolute;inset:0;
  background:radial-gradient(50% 120% at 50% 0%,rgba(236,15,255,.22),transparent 60%);pointer-events:none}
.pit-cta>*{position:relative}
.pit-cta h2{font-family:var(--font-display);font-size:42px;font-weight:700;letter-spacing:-.02em;margin:0 0 16px}
.pit-cta p{font-family:var(--font-body);font-size:16px;line-height:1.6;color:var(--on-surface-variant);margin:0}
.pit-cta__actions{display:flex;gap:16px;justify-content:center;margin-top:28px;flex-wrap:wrap}

/* Footer */
.pit-footer{border-top:1px solid var(--outline-variant);margin-top:60px}
.pit-footer__grid{max-width:var(--container-max);margin:0 auto;padding:56px var(--margin-desktop) 40px;
  display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px}
.pit-footer__brand p{font-family:var(--font-body);font-size:13.5px;line-height:1.6;
  color:var(--on-surface-variant);max-width:30ch;margin:16px 0 0}
.pit-footer__col h5{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;
  color:var(--on-surface-variant);margin:0 0 16px;font-weight:600}
.pit-footer__col a{display:block;font-family:var(--font-body);font-size:14px;color:var(--on-surface);
  text-decoration:none;margin-bottom:11px;cursor:pointer;transition:color var(--dur)}
.pit-footer__col a:hover{color:var(--tertiary)}
.pit-footer__icons{display:flex;gap:14px;margin-top:16px;color:var(--tertiary)}
.pit-footer__base{max-width:var(--container-max);margin:0 auto;padding:20px var(--margin-desktop);
  border-top:1px solid var(--outline-variant);display:flex;justify-content:space-between;align-items:center;
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;color:var(--on-surface-variant)}

/* Modal */
.pit-overlay{position:fixed;inset:0;z-index:100;background:rgba(6,14,32,.6);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:24px;animation:pit-fade var(--dur) var(--ease-out)}
.pit-modal{position:relative;width:100%;max-width:440px;border-radius:var(--radius-xl);padding:32px;
  background:rgba(23,31,51,.92);backdrop-filter:blur(var(--glass-blur-floating));
  -webkit-backdrop-filter:blur(var(--glass-blur-floating));border:1px solid var(--glass-border);
  box-shadow:var(--shadow-float);display:flex;flex-direction:column;gap:14px;
  animation:pit-rise var(--dur-slow) var(--ease-out)}
.pit-modal__x{position:absolute;top:18px;right:18px;background:none;border:none;
  color:var(--on-surface-variant);cursor:pointer}
.pit-modal__title{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.pit-modal__sub{font-family:var(--font-body);font-size:14.5px;color:var(--on-surface-variant);margin:0}
.pit-field{display:flex;flex-direction:column;gap:7px}
.pit-field>span{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;color:var(--on-surface-variant)}
.pit-field input,.pit-field textarea{background:var(--surface-container-lowest);color:var(--on-surface);
  border:1px solid var(--outline-variant);border-radius:var(--radius);padding:11px 13px;
  font-family:var(--font-body);font-size:15px;outline:none;resize:none;transition:all var(--dur)}
.pit-field input:focus,.pit-field textarea:focus{border-color:var(--secondary);box-shadow:var(--glow-cyan)}
.pit-modal__done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:16px 0}
.chk-icon{width:48px;height:48px;border-radius:50%;background:rgba(6,214,240,.12);
  display:flex;align-items:center;justify-content:center;color:var(--success)}
@keyframes pit-fade{from{opacity:0}to{opacity:1}}
@keyframes pit-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Pulse layer */
.pit-pulse-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pit-pulse{position:absolute;border-radius:50%;
  animation:pit-pulse-expand var(--pd,7s) ease-out infinite;animation-delay:var(--dd,0s)}
.pit-pulse--v{background:radial-gradient(circle,rgba(128,131,255,.22) 0%,rgba(128,131,255,.06) 40%,transparent 70%)}
.pit-pulse--m{background:radial-gradient(circle,rgba(236,15,255,.18) 0%,rgba(236,15,255,.05) 40%,transparent 70%)}
.pit-pulse--c{background:radial-gradient(circle,rgba(76,215,246,.14) 0%,rgba(76,215,246,.04) 40%,transparent 70%)}
@keyframes pit-pulse-expand{0%{transform:scale(.15);opacity:.9}55%{opacity:.4}100%{transform:scale(2.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.pit-pulse{animation:none;opacity:0}}

@media(max-width:900px){
  .pit-navlinks,.pit-nav-cta{display:none}
  .pit-burger{display:inline-flex}
  .pit-mobilemenu{display:flex;flex-direction:column;gap:18px;position:absolute;top:100%;left:0;right:0;
    background:rgba(11,19,38,.96);backdrop-filter:blur(12px);
    padding:24px var(--margin-desktop);border-bottom:1px solid var(--outline-variant)}
  .page-hero{padding:60px var(--margin-mobile) 48px}
  .pit-section{padding:64px var(--margin-mobile)}
  .port-grid{grid-template-columns:1fr}
  .pit-footer__grid{grid-template-columns:1fr 1fr;gap:28px}
  .pit-footer__base{flex-direction:column;gap:12px;text-align:center}
}
</style>
</head>

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel">

function Icon({ name, size=20, color, strokeWidth=2, style={} }) {
  return <i data-lucide={name} style={{width:size,height:size,display:'inline-flex',color,...style}} data-stroke={strokeWidth}/>;
}
function useLucide() { React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); }); }

function PulseLayer() {
  return (
    <div className="pit-pulse-layer" aria-hidden="true">
      <div className="pit-pulse pit-pulse--v" style={{width:700,height:700,top:-180,left:-180,'--pd':'8s','--dd':'0s'}}/>
      <div className="pit-pulse pit-pulse--v" style={{width:700,height:700,top:-180,left:-180,'--pd':'8s','--dd':'2.7s'}}/>
      <div className="pit-pulse pit-pulse--v" style={{width:700,height:700,top:-180,left:-180,'--pd':'8s','--dd':'5.4s'}}/>
      <div className="pit-pulse pit-pulse--m" style={{width:560,height:560,top:-120,right:-120,'--pd':'9s','--dd':'1.1s'}}/>
      <div className="pit-pulse pit-pulse--m" style={{width:560,height:560,top:-120,right:-120,'--pd':'9s','--dd':'4.1s'}}/>
      <div className="pit-pulse pit-pulse--m" style={{width:560,height:560,top:-120,right:-120,'--pd':'9s','--dd':'7.1s'}}/>
      <div className="pit-pulse pit-pulse--c" style={{width:440,height:440,top:'40%',left:'42%','--pd':'11s','--dd':'3.5s'}}/>
      <div className="pit-pulse pit-pulse--c" style={{width:440,height:440,top:'40%',left:'42%','--pd':'11s','--dd':'8.8s'}}/>
    </div>
  );
}

const NAV_LINKS = [
  {label:'Services',  href:'services.html'},
  {label:'Innovation',href:null},
  {label:'Portfolio', href:'portfolio.html'},
  {label:'About',     href:'about.html'},
];
function Nav({ active, onCta }) {
  const [open, setOpen] = React.useState(false);
  const lp = l => l.href ? {href:l.href} : {href:'#',onClick:e=>e.preventDefault()};
  return (
    <header className="pit-nav">
      <a className="pit-logo" href="index.html">
        <img src="assets/logo-mark.svg" alt="" width="32" height="32" onError={e=>e.target.style.display='none'}/>
        <span className="pit-wm">PULSE<span>_IT</span></span>
      </a>
      <nav className="pit-navlinks">
        {NAV_LINKS.map(l=><a key={l.label} {...lp(l)} className={'pit-navlink'+(active===l.label?' is-active':'')}>{l.label}</a>)}
      </nav>
      <button className="pit-btn pit-btn--mono pit-nav-cta" onClick={onCta}>GET_STARTED</button>
      <button className="pit-burger" onClick={()=>setOpen(!open)} aria-label="Menu">
        <Icon name={open?'x':'menu'} size={22}/>
      </button>
      {open && (
        <div className="pit-mobilemenu">
          {NAV_LINKS.map(l=><a key={l.label} {...lp(l)} className="pit-navlink" onClick={()=>setOpen(false)}>{l.label}</a>)}
          <button className="pit-btn pit-btn--mono" onClick={()=>{onCta();setOpen(false)}}>GET_STARTED</button>
        </div>
      )}
    </header>
  );
}

    desc: 'A trust-forward website for a boutique civil law firm — structured practice area pages, attorney bio profiles, and a gated consultation request form with a built-in conflict-check intake workflow. Compliant with Washington State Bar guidelines.',
    stack: ['React', 'HubSpot CMS', 'Netlify', 'Zapier'],
    img: 'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=800&q=80&auto=format&fit=crop',
    tint: 'rgba(192,193,255,0.2)',
    accentColor: '#c0c1ff',
    accentGlow: 'rgba(192,193,255,0.14)',
    live: false,
    scope: 'Design · Intake · Dev',
  },
];

function ProjectCard({ p }) {
  return (
    <div className="port-card"
         style={{'--pc-accent':`rgba(${p.accentColor === '#4cd7f6' ? '76,215,246' : p.accentColor === '#fbabff' ? '251,171,255' : '192,193,255'},.4)`,
                 '--pc-glow': p.accentGlow}}>
      {/* Thumbnail */}
      <div className="port-card__thumb">
        <img className="port-card__img" src={p.img} alt={p.client}
             onError={e=>{ e.target.style.display='none'; e.target.nextSibling.nextSibling.style.background=p.tint; }}/>
        <div className="port-card__overlay"/>
        <div className="port-card__tint" style={{background:p.tint}}/>
        <div className="port-card__badges">
          <span className="port-badge">{p.category}</span>
          {p.live
            ? <span className="port-badge port-badge--live">LIVE</span>
            : <span className="port-badge" style={{color:'var(--warning)',borderColor:'rgba(255,194,75,.3)'}}>COMING SOON</span>
          }
        </div>
        <div className="port-card__num">{p.num}</div>
      </div>

      {/* Body */}
      <div className="port-card__body">
        <div>
          <div className="port-card__cat">{p.category}</div>
          <h3 className="port-card__title">{p.client}</h3>
          <div className="port-card__loc">{p.location}</div>
        </div>
        <p className="port-card__desc">{p.desc}</p>
        <div className="port-stack">
          {p.stack.map(s=><span key={s} className="port-stack-tag">{s}</span>)}
        </div>
        <div className="port-card__foot">
          {p.live
            ? <a className="port-link" style={{'--pc-accent-color':p.accentColor}} href="#">VIEW_LIVE <Icon name="arrow-up-right" size={13}/></a>
            : <span className="port-link port-link--disabled" style={{'--pc-accent-color':p.accentColor}}>LINK_PENDING <Icon name="clock" size={13}/></span>
          }
          <span className="port-card__scope"><Icon name="layers" size={13}/>{p.scope}</span>
        </div>
      </div>
    </div>
  );
}

function Footer() {
  return (
    <footer className="pit-footer">
      <div className="pit-footer__grid">
        <div className="pit-footer__brand">
          <a className="pit-logo" href="index.html">
            <img src="assets/logo-mark.svg" alt="" width="30" height="30" onError={e=>e.target.style.display='none'}/>
            <span className="pit-wm">PULSE<span>_IT</span></span>
          </a>
          <p>Advancing the standard of digital infrastructure through relentless innovation and unwavering security.</p>
        </div>
        {[{h:'NAVIGATION',ls:['Innovation Hub','Success Stories','Engineer Docs']},{h:'LEGAL & AUDIT',ls:['Privacy Policy','Terms of Service','Security Audit']}].map(c=>(
          <div key={c.h} className="pit-footer__col"><h5>{c.h}</h5>{c.ls.map(l=><a key={l}>{l}</a>)}</div>
        ))}
        <div className="pit-footer__col">
          <h5>CONTACT</h5><a>Contact Support</a>
          <div className="pit-footer__icons"><Icon name="git-branch" size={18}/><Icon name="share-2" size={18}/><Icon name="network" size={18}/></div>
        </div>
      </div>
      <div className="pit-footer__base">
        <span>® 2026 PULSE_IT. SECURING THE FUTURE.</span>
        <span className="pit-status"><span className="pit-pip"/>ALL NODES OPERATIONAL</span>
      </div>
    </footer>
  );
}

function ContactModal({ open, onClose }) {
  const [sent, setSent] = React.useState(false);
  React.useEffect(()=>{ if(!open) setSent(false); },[open]);
  if(!open) return null;
  return (
    <div className="pit-overlay" onClick={onClose}>
      <div className="pit-modal" onClick={e=>e.stopPropagation()}>
        <button className="pit-modal__x" onClick={onClose}><Icon name="x" size={18}/></button>
        {!sent ? (<>
          <span className="pit-eyebrow">INITIATE_CONTACT</span>
          <h3 className="pit-modal__title">Talk to an Engineer</h3>
          <p className="pit-modal__sub">Tell us where you are today. We'll map the migration.</p>
          <label className="pit-field"><span>WORK_EMAIL</span><input type="email" placeholder="you@company.com"/></label>
          <label className="pit-field"><span>WHAT_DO_YOU_NEED</span><textarea rows="3" placeholder="IT support, a new website, cloud migration…"/></label>
          <button className="pit-btn pit-btn--neon pit-btn--mono" style={{width:'100%'}} onClick={()=>setSent(true)}>TRANSMIT_REQUEST</button>
        </>) : (
          <div className="pit-modal__done">
            <span className="chk-icon"><Icon name="check" size={24}/></span>
            <h3 className="pit-modal__title">Signal received.</h3>
            <p className="pit-modal__sub">An engineer will reach out within one business day.</p>
            <button className="pit-btn pit-btn--quiet" onClick={onClose}>Close</button>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [modal, setModal] = React.useState(false);
  useLucide();
  return (
    <div className="pit-site">
      <div className="pit-bg"/>
      <PulseLayer/>
      <Nav active="Portfolio" onCta={()=>setModal(true)}/>
      <main>
        <div className="page-hero">
          <span className="pit-eyebrow">OUR_WORK · LOCAL_IMPACT</span>
          <h1>Real Businesses.<br/><span className="text-gradient">Real Results.</span></h1>
          <p>From elementary schools to law firms — we build websites and technology systems for the businesses that keep communities running.</p>
          <div className="page-hero__meta">
            <div className="hero-stat">
              <span className="hero-stat__num" style={{color:'var(--tertiary)'}}>4</span>
              <span className="hero-stat__label">Featured Projects</span>
            </div>
            <div className="hero-divider"/>
            <div className="hero-stat">
              <span className="hero-stat__num" style={{color:'var(--secondary)'}}>4</span>
              <span className="hero-stat__label">Industries</span>
            </div>
            <div className="hero-divider"/>
            <div className="hero-stat">
              <span className="hero-stat__num" style={{color:'var(--primary)'}}>100%</span>
              <span className="hero-stat__label">Custom Built</span>
            </div>
          </div>
        </div>

        <section className="pit-section">
          <div className="port-grid">
            {PROJECTS.map(p=><ProjectCard key={p.num} p={p}/>)}
          </div>
        </section>

        <section className="pit-section" style={{paddingTop:0}}>
          <div className="pit-cta">
            <div className="pit-cta__glow"/>
            <h2>Your Business, Next.</h2>
            <p>We're actively taking on new web design clients. Tell us about your business and what you need.</p>
            <div className="pit-cta__actions">
              <button className="pit-btn pit-btn--neon pit-btn--mono" onClick={()=>setModal(true)}>START_PROJECT</button>
              <a className="pit-btn pit-btn--quiet" href="services.html">Explore Services</a>
            </div>
          </div>
        </section>
      </main>
      <Footer/>
      <ContactModal open={modal} onClose={()=>setModal(false)}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
