<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse IT Consulting — Future-Proof Your Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --surface-container-lowest: #060e20;
      --surface: #0b1326;
      --surface-container-low: #131b2e;
      --surface-container: #171f33;
      --surface-container-high: #222a3d;
      --surface-container-highest: #2d3449;
      --surface-bright: #31394d;
      --surface-variant: #2d3449;
      --on-surface: #dae2fd;
      --on-surface-variant: #c7c4d7;
      --outline: #908fa0;
      --outline-variant: #464554;
      --primary: #c0c1ff;
      --secondary: #4cd7f6;
      --tertiary: #fbabff;
      --neon-magenta: #ec0fff;
      --neon-magenta-bright: #ff3dff;
      --success: #06d6f0;
      --warning: #ffc24b;
      --critical: #d946ef;
      --gradient-neon: linear-gradient(135deg, #ec0fff 0%, #8083ff 100%);
      --gradient-heading: linear-gradient(180deg, #fbabff 0%, #ec0fff 100%);
      --radius: 0.25rem;
      --radius-md: 0.375rem;
      --radius-lg: 0.5rem;
      --radius-xl: 0.75rem;
      --radius-full: 9999px;
      --margin-mobile: 16px;
      --margin-desktop: 48px;
      --container-max: 1280px;
      --section-gap: 120px;
      --glass-fill: rgba(23, 31, 51, 0.55);
      --glass-border: rgba(255, 255, 255, 0.10);
      --glass-blur: 12px;
      --glass-blur-floating: 24px;
      --glow-cyan: 0 0 16px rgba(76, 215, 246, 0.45);
      --glow-magenta-sh: 0 0 24px rgba(236, 15, 255, 0.45);
      --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.45);
      --shadow-float: 0 16px 50px rgba(0, 0, 0, 0.55);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur: 220ms;
      --dur-slow: 400ms;
      --font-display: 'Geist', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    .text-gradient {
      background: var(--gradient-heading);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--surface-container-lowest);
      color: var(--on-surface);
      font-family: var(--font-body)
    }

    .pit-site {
      position: relative;
      overflow-x: hidden
    }

    .pit-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(60% 50% at 18% 0%, rgba(128, 131, 255, .22) 0%, transparent 60%),
        radial-gradient(45% 40% at 88% 8%, rgba(236, 15, 255, .16) 0%, transparent 55%),
        var(--surface-container-lowest)
    }

    main,
    .pit-nav,
    .pit-footer {
      position: relative;
      z-index: 1
    }

    /* Buttons */
    .pit-btn {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      padding: 13px 24px;
      border: 1px solid transparent;
      transition: all var(--dur) var(--ease-out);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px
    }

    .pit-btn--neon {
      background: var(--neon-magenta);
      color: #fff;
      box-shadow: var(--glow-magenta-sh)
    }

    .pit-btn--neon:hover {
      background: var(--neon-magenta-bright);
      box-shadow: 0 0 32px rgba(236, 15, 255, .6)
    }

    .pit-btn--quiet {
      background: var(--surface-container-high);
      color: var(--on-surface);
      border-color: var(--glass-border)
    }

    .pit-btn--quiet:hover {
      background: var(--surface-bright);
      border-color: var(--secondary)
    }

    .pit-btn--mono {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: .06em;
      font-size: 13px;
      font-weight: 500
    }

    .pit-btn:active {
      transform: translateY(1px)
    }

    /* Shared atoms */
    .pit-monolink {
      font-family: var(--font-mono);
      font-size: 12.5px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--tertiary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: gap var(--dur) var(--ease-out)
    }

    .pit-monolink:hover {
      gap: 11px
    }

    .pit-eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--tertiary);
      border: 1px dashed rgba(236, 15, 255, .4);
      border-radius: var(--radius);
      padding: 6px 12px;
      display: inline-block
    }

    .pit-logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      text-decoration: none
    }

    .pit-wm {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 19px;
      letter-spacing: .04em;
      color: var(--on-surface)
    }

    .pit-wm span {
      color: var(--neon-magenta)
    }

    .pit-status {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
      display: inline-flex;
      align-items: center;
      gap: 8px
    }

    .pit-status--mag {
      color: var(--tertiary)
    }

    .pit-pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pit-pulse 1.8s var(--ease-in-out) infinite
    }

    @keyframes pit-pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    /* Nav */
    .pit-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 18px var(--margin-desktop);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px)
    }

    .pit-navlinks {
      display: flex;
      gap: 34px
    }

    .pit-navlink {
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--on-surface-variant);
      cursor: pointer;
      text-decoration: none;
      transition: color var(--dur)
    }

    .pit-navlink:hover {
      color: var(--on-surface)
    }

    .pit-navlink.is-active {
      color: var(--tertiary);
      text-shadow: 0 0 12px rgba(236, 15, 255, .5)
    }

    .pit-burger {
      display: none;
      background: none;
      border: none;
      color: var(--on-surface);
      cursor: pointer;
      padding: 4px
    }

    .pit-mobilemenu {
      display: none
    }

    /* Hero */
    .pit-hero {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 64px var(--margin-desktop) 90px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: center
    }

    .pit-hero__copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px
    }

    .pit-h1 {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -.04em;
      margin: 0
    }

    .pit-lead {
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      color: var(--on-surface-variant);
      max-width: 30ch;
      margin: 0
    }

    .pit-hero__cta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 4px
    }

    .pit-hero__panel {
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 18px;
      background: var(--glass-fill);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      box-shadow: var(--shadow-card)
    }

    .pit-render {
      position: relative;
      aspect-ratio: 16/11;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: radial-gradient(120% 120% at 50% 120%, rgba(6, 214, 240, .22) 0%, #060e20 60%);
      border: 1px solid var(--outline-variant);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .pit-render__glow {
      position: absolute;
      inset: auto 0 0 0;
      height: 55%;
      background: radial-gradient(70% 100% at 50% 100%, rgba(6, 214, 240, .35) 0%, transparent 70%)
    }

    .pit-render__bars {
      position: absolute;
      left: 22px;
      top: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 42%
    }

    .pit-render__bars span {
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, rgba(76, 215, 246, .7), rgba(76, 215, 246, .1))
    }

    .pit-render__status {
      display: flex;
      justify-content: space-between;
      padding: 14px 6px 4px
    }

    /* Video hero panel */
    .pit-hero__panel--video {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--glass-border);
      min-height: 380px;
      display: flex;
      align-items: flex-end;
    }
    .pit-vp-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.82) saturate(0.9);
    }
    .pit-vp-tint {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(160deg, rgba(6,14,32,0.18) 0%, rgba(6,14,32,0.45) 100%);
    }
    @media (max-width: 900px) {
      .pit-hero__panel--video { min-height: 280px; }
    }

    /* Sections */
    .pit-section {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--section-gap) var(--margin-desktop)
    }

    .pit-section__head {
      text-align: center;
      max-width: 620px;
      margin: 0 auto 56px
    }

    .pit-h2 {
      font-family: var(--font-display);
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin: 0 0 16px;
      line-height: 1.1
    }

    .pit-h2--left {
      text-align: left
    }

    .pit-sub {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      color: var(--on-surface-variant);
      margin: 0
    }

    .pit-sub--left {
      text-align: left;
      max-width: 46ch
    }

    /* Services */
    .pit-svc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px
    }

    .pit-svc {
      background: var(--glass-fill);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all var(--dur) var(--ease-out)
    }

    .pit-svc.is-hover {
      border-color: rgba(236, 15, 255, .45);
      box-shadow: 0 0 28px rgba(236, 15, 255, .18);
      transform: translateY(-3px)
    }

    .pit-svc__icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: rgba(236, 15, 255, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tertiary)
    }

    .pit-svc__title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -.01em
    }

    .pit-svc__body {
      font-family: var(--font-body);
      font-size: 14.5px;
      line-height: 1.55;
      color: var(--on-surface-variant);
      margin: 0;
      flex: 1
    }

    /* Feature */
    .pit-feature {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center
    }

    .pit-feature__media {
      position: relative;
      aspect-ratio: 4/5;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: linear-gradient(180deg, #0a1422 0%, #060e20 100%);
      border: 1px solid var(--outline-variant)
    }

    .pit-feature__img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 35%
    }

    .pit-feature__media::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(6, 10, 20, 0) 55%, rgba(6, 10, 20, .55) 100%)
    }

    .pit-feature__copy {
      display: flex;
      flex-direction: column;
      gap: 20px
    }

    .pit-proof {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 22px
    }

    .pit-proof__item {
      display: flex;
      gap: 16px
    }

    .pit-proof__icon {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: rgba(6, 214, 240, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--secondary)
    }

    .pit-proof__title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 4px
    }

    .pit-proof__body {
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      color: var(--on-surface-variant);
      margin: 0
    }

    /* CTA */
    .pit-cta {
      position: relative;
      overflow: hidden;
      text-align: center;
      border-radius: var(--radius-xl);
      border: 1px solid var(--glass-border);
      padding: 72px 32px;
      background: linear-gradient(180deg, rgba(34, 42, 61, .6), rgba(11, 19, 38, .6));
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur))
    }

    .pit-cta__glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(50% 120% at 50% 0%, rgba(236, 15, 255, .22), transparent 60%);
      pointer-events: none
    }

    .pit-cta>* {
      position: relative
    }

    .pit-cta__actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 28px;
      flex-wrap: wrap
    }

    /* Footer */
    .pit-footer {
      border-top: 1px solid var(--outline-variant);
      margin-top: 60px
    }

    .pit-footer__grid {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 56px var(--margin-desktop) 40px;
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      gap: 40px
    }

    .pit-footer__brand p {
      font-family: var(--font-body);
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--on-surface-variant);
      max-width: 30ch;
      margin: 16px 0 0
    }

    .pit-footer__col h5 {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--on-surface-variant);
      margin: 0 0 16px;
      font-weight: 600
    }

    .pit-footer__col a {
      display: block;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--on-surface);
      text-decoration: none;
      margin-bottom: 11px;
      cursor: pointer;
      transition: color var(--dur)
    }

    .pit-footer__col a:hover {
      color: var(--tertiary)
    }

    .pit-footer__icons {
      display: flex;
      gap: 14px;
      margin-top: 16px;
      color: var(--tertiary)
    }

    .pit-footer__base {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 20px var(--margin-desktop);
      border-top: 1px solid var(--outline-variant);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11.5px;
      letter-spacing: .06em;
      color: var(--on-surface-variant)
    }

    /* Modal */
    .pit-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(6, 14, 32, .6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: pit-fade var(--dur) var(--ease-out)
    }

    .pit-modal {
      position: relative;
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-xl);
      padding: 32px;
      background: rgba(23, 31, 51, .92);
      backdrop-filter: blur(var(--glass-blur-floating));
      -webkit-backdrop-filter: blur(var(--glass-blur-floating));
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-float);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: pit-rise var(--dur-slow) var(--ease-out)
    }

    .pit-modal__x {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: none;
      color: var(--on-surface-variant);
      cursor: pointer
    }

    .pit-modal__title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin: 0
    }

    .pit-modal__sub {
      font-family: var(--font-body);
      font-size: 14.5px;
      color: var(--on-surface-variant);
      margin: 0
    }

    .pit-field {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .pit-field>span {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .07em;
      color: var(--on-surface-variant)
    }

    .pit-field input,
    .pit-field textarea {
      background: var(--surface-container-lowest);
      color: var(--on-surface);
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius);
      padding: 11px 13px;
      font-family: var(--font-body);
      font-size: 15px;
      outline: none;
      resize: none;
      transition: all var(--dur)
    }

    .pit-field input:focus,
    .pit-field textarea:focus {
      border-color: var(--secondary);
      box-shadow: var(--glow-cyan)
    }

    .pit-modal__done {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 16px 0
    }

    @keyframes pit-fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes pit-rise {
      from {
        opacity: 0;
        transform: translateY(16px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* Responsive */
    @media(max-width:900px) {

      .pit-navlinks,
      .pit-nav-cta {
        display: none
      }

      .pit-burger {
        display: inline-flex
      }

      .pit-mobilemenu {
        display: flex;
        flex-direction: column;
        gap: 18px;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(11, 19, 38, .96);
        backdrop-filter: blur(12px);
        padding: 24px var(--margin-desktop);
        border-bottom: 1px solid var(--outline-variant)
      }

      .pit-hero,
      .pit-feature {
        grid-template-columns: 1fr;
        gap: 40px
      }

      .pit-svc-grid {
        grid-template-columns: 1fr
      }

      .pit-h1 {
        font-size: 42px
      }

      .pit-h2 {
        font-size: 32px
      }

      .pit-section {
        padding: 72px var(--margin-mobile)
      }

      .pit-hero {
        padding: 40px var(--margin-mobile) 60px
      }

      .pit-footer__grid {
        grid-template-columns: 1fr 1fr;
        gap: 28px
      }

      .pit-footer__base {
        flex-direction: column;
        gap: 12px;
        text-align: center
      }
    }

    /* Pulse wave layer */
    .pit-pulse-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .pit-pulse {
      position: absolute;
      border-radius: 50%;
      animation: pit-pulse-expand var(--pd, 7s) ease-out infinite;
      animation-delay: var(--dd, 0s);
    }
    .pit-pulse--v {
      background: radial-gradient(circle, rgba(128,131,255,0.22) 0%, rgba(128,131,255,0.06) 40%, transparent 70%);
    }
    .pit-pulse--m {
      background: radial-gradient(circle, rgba(236,15,255,0.18) 0%, rgba(236,15,255,0.05) 40%, transparent 70%);
    }
    .pit-pulse--c {
      background: radial-gradient(circle, rgba(76,215,246,0.14) 0%, rgba(76,215,246,0.04) 40%, transparent 70%);
    }
    @keyframes pit-pulse-expand {
      0%   { transform: scale(0.15); opacity: 0.9; }
      55%  { opacity: 0.4; }
      100% { transform: scale(2.8);  opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pit-pulse { animation: none; opacity: 0; }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="text/babel">

    function Icon({ name, size = 20, color, strokeWidth = 2, style = {} }) {
      return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-flex', color, ...style }} data-stroke={strokeWidth} />;
    }
    function useLucide() {
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    }

    function PulseLayer() {
      return (
        <div className="pit-pulse-layer" aria-hidden="true">
          {/* Violet pulses — top-left, matching existing violet glow */}
          <div className="pit-pulse pit-pulse--v" style={{width:700,height:700,top:-180,left:-180,'--pd':'8s','--dd':'0s'}} />
          <div className="pit-pulse pit-pulse--v" style={{width:700,height:700,top:-180,left:-180,'--pd':'8s','--dd':'2.7s'}} />
          <div className="pit-pulse pit-pulse--v" style={{width:700,height:700,top:-180,left:-180,'--pd':'8s','--dd':'5.4s'}} />
          {/* Magenta pulses — top-right, matching existing magenta glow */}
          <div className="pit-pulse pit-pulse--m" style={{width:560,height:560,top:-120,right:-120,'--pd':'9s','--dd':'1.1s'}} />
          <div className="pit-pulse pit-pulse--m" style={{width:560,height:560,top:-120,right:-120,'--pd':'9s','--dd':'4.1s'}} />
          <div className="pit-pulse pit-pulse--m" style={{width:560,height:560,top:-120,right:-120,'--pd':'9s','--dd':'7.1s'}} />
          {/* Cyan accent pulse — mid-page */}
          <div className="pit-pulse pit-pulse--c" style={{width:440,height:440,top:'40%',left:'42%','--pd':'11s','--dd':'3.5s'}} />
          <div className="pit-pulse pit-pulse--c" style={{width:440,height:440,top:'40%',left:'42%','--pd':'11s','--dd':'8.8s'}} />
        </div>
      );
    }

    const NAV_LINKS = [
      { label: 'Services',   href: 'services.html' },
      { label: 'Innovation', href: null },
      { label: 'Portfolio',  href: 'portfolio.html' },
      { label: 'About',      href: 'about.html' },
    ];
    function Nav({ active, onCta }) {
      const [open, setOpen] = React.useState(false);
      const linkProps = (l) => l.href
        ? { href: l.href }
        : { href: '#', onClick: e => e.preventDefault() };
      return (
        <header className="pit-nav">
          <a className="pit-logo" href="index.html">
            <img src="assets/logo-mark.svg" alt="" width="32" height="32" onError={e => e.target.style.display = 'none'} />
            <span className="pit-wm">PULSE<span>_IT</span></span>
          </a>
          <nav className="pit-navlinks">
            {NAV_LINKS.map(l => (
              <a key={l.label} {...linkProps(l)} className={'pit-navlink' + (active === l.label ? ' is-active' : '')}>{l.label}</a>
            ))}
          </nav>
          <button className="pit-btn pit-btn--mono pit-nav-cta" onClick={onCta}>GET_STARTED</button>
          <button className="pit-burger" onClick={() => setOpen(!open)} aria-label="Menu">
            <Icon name={open ? 'x' : 'menu'} size={22} />
          </button>
          {open && (
            <div className="pit-mobilemenu">
              {NAV_LINKS.map(l => (
                <a key={l.label} {...linkProps(l)} className="pit-navlink" onClick={() => setOpen(false)}>{l.label}</a>
              ))}
              <button className="pit-btn pit-btn--mono" onClick={() => { onCta(); setOpen(false); }}>GET_STARTED</button>
            </div>
          )}
        </header>
      );
    }

    function HeroVideoPanel() {
      return (
        <div className="pit-hero__panel--video">
          <img className="pit-vp-img"
            src="https://images.unsplash.com/photo-1531482615713-2afd69097998?w=900&q=80&auto=format&fit=crop"
            alt="Team collaborating on technology solutions" />
          <div className="pit-vp-tint" />
        </div>
      );
    }

    function Hero({ onCta }) {
      return (
        <section className="pit-hero">
          <div className="pit-hero__copy">
            <span className="pit-eyebrow">TECHNOLOGY AND DESIGN · SOLUTIONS</span>
            <h1 className="pit-h1">Future-Proof Your<br /><span className="text-gradient">Technology</span></h1>
            <p className="pit-lead">We stay ahead of what's next — bringing security-forward design, modern architecture, and industry best practices to every solution we build for your business.</p>
            <div className="pit-hero__cta">
              <button className="pit-btn pit-btn--neon" onClick={onCta}>Get Started</button>
              <button className="pit-btn pit-btn--quiet">View Roadmap</button>
            </div>
          </div>
          <HeroVideoPanel />
        </section>
      );
    }

    const SERVICES = [
      { icon: 'headphones', title: 'IT Support Services', body: '24/7 helpdesk and proactive infrastructure monitoring that keeps your systems running, patched, and problem-free around the clock.', link: 'Explore (Read More) ->' },
      { icon: 'layout', title: 'Web Design Solutions', body: 'Modern, high-performance websites crafted with precision design and conversion-focused layouts that make your brand stand out.', link: 'Explore (Read More) ->' },
      { icon: 'workflow', title: 'Automation and App Development', body: 'Custom applications and workflow automation that eliminate repetitive tasks and streamline your operations end to end.', link: 'Explore (Read More) ->' },
    ];
    function ServiceCard({ s }) {
      const [hover, setHover] = React.useState(false);
      return (
        <article className={'pit-svc' + (hover ? ' is-hover' : '')} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}>
          <div className="pit-svc__icon"><Icon name={s.icon} size={22} /></div>
          <h3 className="pit-svc__title">{s.title}</h3>
          <p className="pit-svc__body">{s.body}</p>
          <a className="pit-monolink">{s.link} <Icon name="arrow-right" size={14} /></a>
        </article>
      );
    }
    function Services() {
      return (
        <section className="pit-section" id="services">
          <div className="pit-section__head">
            <h2 className="pit-h2">Our Core Expertise</h2>
            <p className="pit-sub">Specialized vertical solutions designed to withstand the complexities of the modern digital landscape.</p>
          </div>
          <div className="pit-svc-grid">{SERVICES.map(s => <ServiceCard key={s.title} s={s} />)}</div>
        </section>
      );
    }

    const PROOF = [
      { icon: 'circle-check-big', title: '99.999% Uptime Commitment', body: 'Redundant global nodes ensuring your services never skip a beat, regardless of regional incidents.' },
      { icon: 'zap', title: 'Latency Optimization', body: 'Edge computing nodes positioned at critical network junctions for sub-millisecond response times.' },
      { icon: 'lock', title: 'Automated Patch Management', body: 'Continuous update automation keeps every system running the latest security patches, closing vulnerability windows before they can be exploited.' },
    ];
    function Feature() {
      return (
        <section className="pit-section pit-feature">
          <div className="pit-feature__media">
            <img className="pit-feature__img" src="assets/tech_001.jpg" alt="Data center hardware and network infrastructure" />
          </div>
          <div className="pit-feature__copy">
            <h2 className="pit-h2 pit-h2--left">Elite Scalability<br />&amp; Performance</h2>
            <p className="pit-sub pit-sub--left">We don't just build infrastructure; we build resilience. Our systems are engineered to handle the load of the next decade, today.</p>
            <ul className="pit-proof">
              {PROOF.map(p => (
                <li key={p.title} className="pit-proof__item">
                  <span className="pit-proof__icon"><Icon name={p.icon} size={18} /></span>
                  <div><h4 className="pit-proof__title">{p.title}</h4><p className="pit-proof__body">{p.body}</p></div>
                </li>
              ))}
            </ul>
          </div>
        </section>
      );
    }

    function Cta({ onCta }) {
      return (
        <section className="pit-section">
          <div className="pit-cta">
            <div className="pit-cta__glow" />
            <h2 className="pit-h2">Ready to Evolve?</h2>
            <p className="pit-sub">Join the businesses who have already secured their digital future with Pulse IT Consulting.</p>
            <div className="pit-cta__actions">
              <button className="pit-btn pit-btn--neon pit-btn--mono" onClick={onCta}>START_MIGRATION</button>
              <button className="pit-btn pit-btn--quiet" onClick={onCta}>Talk to an Engineer</button>
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="pit-footer">
          <div className="pit-footer__grid">
            <div className="pit-footer__brand">
              <a className="pit-logo">
                <img src="assets/logo-mark.svg" alt="" width="30" height="30" onError={e => e.target.style.display = 'none'} />
                <span className="pit-wm">PULSE<span>_IT</span></span>
              </a>
              <p>Advancing the standard of digital infrastructure through relentless innovation and unwavering security.</p>
            </div>
            {[{ h: 'NAVIGATION', ls: ['Innovation Hub', 'Success Stories', 'Engineer Docs'] }, { h: 'LEGAL & AUDIT', ls: ['Privacy Policy', 'Terms of Service', 'Security Audit'] }].map(c => (
              <div key={c.h} className="pit-footer__col"><h5>{c.h}</h5>{c.ls.map(l => <a key={l}>{l}</a>)}</div>
            ))}
            <div className="pit-footer__col">
              <h5>CONTACT</h5><a>Contact Support</a>
              <div className="pit-footer__icons"><Icon name="git-branch" size={18} /><Icon name="share-2" size={18} /><Icon name="network" size={18} /></div>
            </div>
          </div>
          <div className="pit-footer__base">
            <span>® 2026 PULSE_IT. SECURING THE FUTURE.</span>
            <span className="pit-status"><span className="pit-pip" />ALL NODES OPERATIONAL</span>
          </div>
        </footer>
      );
    }

    function ContactModal({ open, onClose }) {
      const [sent, setSent] = React.useState(false);
      React.useEffect(() => { if (!open) setSent(false); }, [open]);
      if (!open) return null;
      return (
        <div className="pit-overlay" onClick={onClose}>
          <div className="pit-modal" onClick={e => e.stopPropagation()}>
            <button className="pit-modal__x" onClick={onClose}><Icon name="x" size={18} /></button>
            {!sent ? (<>
              <span className="pit-eyebrow">INITIATE_CONTACT</span>
              <h3 className="pit-modal__title">Talk to an Engineer</h3>
              <p className="pit-modal__sub">Tell us where you are today. We'll map the migration.</p>
              <label className="pit-field"><span>WORK_EMAIL</span><input type="email" placeholder="you@company.com" /></label>
              <label className="pit-field"><span>WHAT_DO_YOU_NEED</span><textarea rows="3" placeholder="IT support, a new website, cloud migration…" /></label>
              <button className="pit-btn pit-btn--neon pit-btn--mono" style={{ width: '100%' }} onClick={() => setSent(true)}>TRANSMIT_REQUEST</button>
            </>) : (
              <div className="pit-modal__done">
                <span className="pit-proof__icon" style={{ width: 48, height: 48 }}><Icon name="check" size={24} color="var(--secondary)" /></span>
                <h3 className="pit-modal__title">Signal received.</h3>
                <p className="pit-modal__sub">An engineer will reach out within one business day.</p>
                <button className="pit-btn pit-btn--quiet" onClick={onClose}>Close</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [modal, setModal] = React.useState(false);
      useLucide();
      return (
        <div className="pit-site">
          <div className="pit-bg" />
          <PulseLayer />
          <Nav active="Home" onCta={() => setModal(true)} />
          <main>
            <Hero onCta={() => setModal(true)} />
            <Services />
            <Feature />
            <Cta onCta={() => setModal(true)} />
          </main>
          <Footer />
          <ContactModal open={modal} onClose={() => setModal(false)} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
